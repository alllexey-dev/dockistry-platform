spring.application.name=dockistry-platform
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dockistry_platform}
spring.datasource.username=${DB_USER:dockistry}
spring.datasource.password=${DB_PASSWORD:dockistry}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=8080

spring.flyway.enabled=true

# 14 days by default
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:1209600000}
# 1 hour by default
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:3600000}
jwt.secret=${JWT_SECRET:secret}

app.public-base-url=${DOCKISTRY_PUBLIC_BASE_URL:http://localhost:8080}

app.auth.email-verification.link-path=${EMAIL_VERIFICATION_PATH:/api/auth/email-verification/link}

# 24 hours by default
app.auth.email-verification.link-code-expiration=${LINK_CODE_EXPIRATION:86400000}

# 15 minutes by default
app.auth.email-verification.number-code-expiration=${NUMBER_CODE_EXPIRATION:900000}


app.auth.email-verification.resend-cooldown=${RESEND_COOLDOWN:60000}

# Default limit before throttle: 5 requests in last hour
app.auth.email-verification.rate-limit=${RATE_LIMIT:5}
app.auth.email-verification.rate-limit-window=${RATE_LIMIT_WINDOW:3600000}

# 12 hours by default
app.auth.email-verification.rate-limit-throttle-interval=${RATE_LIMIT_THROTTLE_INTERVAL:43200000}

app.email-send-job.retry-interval=${EMAIL_SEND_JOB_RETRY_INTERVAL:60000}
app.email-send-job.poll-interval=${EMAIL_SEND_JOB_POLL_INTERVAL:10000}

# How many jobs one worker takes for sending
app.email-send-job.worker-jobs-limit=${EMAIL_SEND_JOB_WORKER_LIMIT:50}

# For how long one worker locks taken tasks before another worker can take PROCESSING tasks
# (in case of the worker that took that task dying)
app.email-send-job.worker-locking-expiration=${EMAIL_SEND_JOB_LOCKING_EXPIRATION:60000}

app.docker-agent.image-pull-timeout=${DOCKER_IMAGE_PULL_TIMEOUT:300000}

app.managed-services.reaper.deployment-timeout=${MANAGED_SERVICE_REAPER_DEPLOYMENT_TIMEOUT:10m}
app.managed-services.reaper.deployment-batch-limit=${MANAGED_SERVICE_REAPER_DEPLOYMENT_BATCH_LIMIT:100}
app.managed-services.reaper.poll-interval=${MANAGED_SERVICE_REAPER_POLL_INTERVAL:60000}
app.managed-services.reaper.runtime-operation-timeout=${MANAGED_SERVICE_REAPER_RUNTIME_OPERATION_TIMEOUT:1m}
app.managed-services.reaper.runtime-operation-batch-limit=${MANAGED_SERVICE_REAPER_RUNTIME_OPERATION_BATCH_LIMIT:100}
app.managed-services.reaper.deleting-service-timeout=${MANAGED_SERVICE_REAPER_DELETING_SERVICE_TIMEOUT:1m}
app.managed-services.reaper.deleting-service-batch-limit=${MANAGED_SERVICE_REAPER_DELETING_SERVICE_BATCH_LIMIT:100}

app.setup.initial-admin.username=${INITIAL_ADMIN_USERNAME:}
app.setup.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
app.setup.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
