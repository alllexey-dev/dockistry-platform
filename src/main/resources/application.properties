spring.application.name=dockistry-platform
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dockistry_platform}
spring.datasource.username=${DB_USER:dockistry}
spring.datasource.password=${DB_PASSWORD:dockistry}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=8080

spring.flyway.enabled=true

# 14 days by default
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:1209600000}
# 1 hour by default
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:3600000}
jwt.secret=${JWT_SECRET:secret}

app.public-base-url=${DOCKISTRY_PUBLIC_BASE_URL:http://localhost:8080}

app.auth.email-verification.link-path=${EMAIL_VERIFICATION_PATH:/api/auth/email-verification/link}
app.auth.email-verification.number-path=${EMAIL_VERIFICATION_NUMBER_PATH:/api/auth/email-verification/number}
