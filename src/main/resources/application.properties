spring.application.name=dockistry-platform
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/dockistry-platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
server.port=8080

jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:1209600000}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:3600000}
jwt.secret=${JWT_SECRET:secret}
