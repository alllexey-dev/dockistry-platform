spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.pool-name=main-pool

app.datasource.execution-gate.hikari.pool-name=execution-gate-pool
app.datasource.execution-gate.hikari.maximum-pool-size=7
app.datasource.execution-gate.hikari.connection-timeout=5000

jwt.refresh-expiration=1209600000
jwt.access-expiration=60000
jwt.secret=test-secret-for-jwt-authentication-tests

app.public-base-url=http://localhost:8080
app.auth.email-verification.link-path=/api/auth/email-verification/link

# 24 hours by default
app.auth.email-verification.link-code-expiration=${LINK_CODE_EXPIRATION:86400000}

# 15 minutes by default
app.auth.email-verification.number-code-expiration=${NUMBER_CODE_EXPIRATION:900000}


app.auth.email-verification.resend-cooldown=${RESEND_COOLDOWN:60000}

# Default limit before throttle: 5 requests in last hour
app.auth.email-verification.rate-limit=${RATE_LIMIT:5}
app.auth.email-verification.rate-limit-window=${RATE_LIMIT_WINDOW:3600000}

# 12 hours by default
app.auth.email-verification.rate-limit-throttle-interval=${RATE_LIMIT_THROTTLE_INTERVAL:43200000}

app.email-send-job.retry-interval=${EMAIL_SEND_JOB_RETRY_INTERVAL:60000}
app.email-send-job.poll-interval=${EMAIL_SEND_JOB_POLL_INTERVAL:10000}

# How many jobs one worker takes for sending
app.email-send-job.worker-jobs-limit=${EMAIL_SEND_JOB_WORKER_LIMIT:50}

# For how long one worker locks taken tasks before another worker can take PROCESSING tasks
# (in case of the worker that took that task dying)
app.email-send-job.worker-locking-expiration=${EMAIL_SEND_JOB_LOCKING_EXPIRATION:60000}

app.docker-agent.image-pull-timeout=${DOCKER_IMAGE_PULL_TIMEOUT:300000}

app.managed-services.deployment-operation-gate.lock-timeout=5s
app.managed-services.project-operation-gate.lock-timeout=5s
app.managed-services.service-operation-gate.lock-timeout=5s

app.managed-services.reaper.deployment-timeout=10m
app.managed-services.reaper.deployment-batch-limit=100
app.managed-services.reaper.poll-interval=60000
app.managed-services.reaper.runtime-operation-timeout=1m
app.managed-services.reaper.runtime-operation-batch-limit=100
app.managed-services.reaper.deleting-service-timeout=1m
app.managed-services.reaper.deleting-service-batch-limit=100
app.managed-services.reaper.deployment-operation-gate-lock-timeout=500ms
app.managed-services.reaper.service-operation-gate-lock-timeout=500ms

app.setup.initial-admin.username=${INITIAL_ADMIN_USERNAME:}
app.setup.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
app.setup.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
